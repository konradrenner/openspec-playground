schema: spec-driven

context: |
  Projekt: Durchlauferhitzer (org.konis openspec-playground)
  Sprache: Deutsch für Doku und Kommunikation, Englisch für Code-Bezeichner.

  Technologie-Stack:
  - Java (aktuelle LTS-Version)
  - Quarkus (aktuelle LTS-Version)
  - Maven (aktuelle Version) als Buildsystem
  - Tooling-Verwaltung ausschließlich via devenv.nix
    (Ziel: alles lokal ohne Docker, aber trotzdem isoliert, testbar und startbar)
  - groupId: org.kore.durchlauferhitzer

  Architektur:
  - Domain-Driven Design (DDD): Die Architektur muss sich auch im Naming
    des Source Codes widerspiegeln (Bounded Contexts, Aggregates, Entities,
    Value Objects, Repositories, Domain Services etc.).
  - Clean Architecture nach dem Boundary-Control-Entity-Muster (BCE),
    um die Abhängigkeiten von außen nach innen zu erzwingen.
  - Keep it simple, stupid (KISS) ist Pflicht: keine Over-Engineerung,
    keine Spekulation, der einfachste Weg, der die Anforderung erfüllt.

  Testing:
  - Architekturtests mit ArchUnit (sichern DDD-Struktur und BCE-Regeln ab).
  - Unit-Tests mit Mockito und JUnit 5 - bewusst OHNE QuarkusTest,
    damit Unit-Tests nicht vom Framework abhängen; Ausführung via Surefire.
  - Integrationstests mit QuarkusTest erlaubt; Ausführung via Failsafe.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
