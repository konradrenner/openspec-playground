quarkus.application.name=raumschiffwerft

# Datenbank: devenv-Postgres (devenv up)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=raumschiffwerft
quarkus.datasource.password=raumschiffwerft
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/raumschiffwerft
kafka.bootstrap.servers=localhost:9092

# Schema-Migration beim Start
quarkus.flyway.migrate-at-start=true

# flagd-DevServices (Docker) sind nicht noetig - es laeuft der Datei-Modus
quarkus.openfeature.flagd.devservices.enabled=false

# Zielsystemwahl: flagd im Datei-Modus (Pfad relativ zum Arbeitsverzeichnis;
# Tests/Dev ueberschreiben ihn auf ../flags/flags.json)
quarkus.openfeature.flagd.offline-path=flags/flags.json

# Annahme und Zustellung
auftrag.retry-after-seconds=5
zustellung.lease-sekunden=600
zustellung.wiederholung-sekunden=60
zustellung.instanz=${HOSTNAME:raumschiffwerft-local}

# Endpunkte der Adapter im lokalen Betrieb (WireMock aus devenv, Port 8089);
# Tests und andere Umgebungen ueberschreiben diese Werte.
quarkus.cxf.client."imperium".client-endpoint-url=http://localhost:8089/imperium
quarkus.rest-client."rebellion".url=http://localhost:8089

# Abgleich faelliger Zustellungen (Timer-Route, Backoff, Endgueltigkeit)
abgleich.timer-period-millis=10000
abgleich.batch=20
abgleich.backoff-max-sekunden=3600
abgleich.jitter-anteil=0.2
abgleich.max-versuche=5

# Journal: Outbox-Relay nach Kafka und Indexierung in OpenSearch
journal.topic=durchlauferhitzer.journal
journal.index=durchlauferhitzer-journal
journal.consumer-group=durchlauferhitzer-journal
journal.opensearch.url=http://localhost:9200
journal.relay.timer-period-millis=2000
journal.relay.batch=50
quarkus.rest-client.journal-opensearch.url=${journal.opensearch.url}

# Idempotenter Kafka-Producer (acks=all steht in der Relay-Route)
camel.component.kafka.configuration.enable-idempotence=true

# Aufraeumen: Aufbewahrungsfrist (Idempotenzfenster), Timer, Batchgroesse
durchlauferhitzer.aufraeumen.aufbewahrung=7d
durchlauferhitzer.aufraeumen.timer-period-millis=600000
durchlauferhitzer.aufraeumen.batch=1000

# OpenTelemetry: alle drei Signale per OTLP zum Collector (devenv).
# Traces und Logs per gRPC (4317), Metriken per HTTP/protobuf (4318).
# Metriken und Logs sind in Quarkus per Default deaktiviert und MUSSEN
# explizit aktiviert werden (nur Tracing ist default an).
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true
quarkus.otel.exporter.otlp.traces.endpoint=http://localhost:4317
quarkus.otel.exporter.otlp.metrics.endpoint=http://localhost:4318
quarkus.otel.exporter.otlp.metrics.protocol=http/protobuf
quarkus.otel.exporter.otlp.logs.endpoint=http://localhost:4317
quarkus.otel.exporter.otlp.logs.protocol=grpc
