quarkus.application.name=raumschiffwerft

# Datenbank: devenv-Postgres (devenv up)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=raumschiffwerft
quarkus.datasource.password=raumschiffwerft
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5432/raumschiffwerft
kafka.bootstrap.servers=localhost:9092

# Schema-Migration beim Start
quarkus.flyway.migrate-at-start=true

# flagd-DevServices (Docker) sind nicht noetig - es laeuft der Datei-Modus
quarkus.openfeature.flagd.devservices.enabled=false

# Zielsystemwahl: flagd im Datei-Modus (Pfad relativ zum Arbeitsverzeichnis;
# Tests/Dev ueberschreiben ihn auf ../flags/flags.json)
quarkus.openfeature.flagd.offline-path=flags/flags.json

# Annahme und Zustellung
auftrag.retry-after-seconds=5
zustellung.lease-sekunden=600
zustellung.wiederholung-sekunden=60
zustellung.instanz=${HOSTNAME:raumschiffwerft-local}

# Abgleich faelliger Zustellungen (Timer-Route, Backoff, Endgueltigkeit)
abgleich.timer-period-millis=10000
abgleich.batch=20
abgleich.backoff-max-sekunden=3600
abgleich.jitter-anteil=0.2
abgleich.max-versuche=5
