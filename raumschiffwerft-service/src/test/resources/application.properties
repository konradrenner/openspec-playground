# Integrationstests laufen im Modulverzeichnis: flagd-Pfad auf die
# Projektwurzel zeigen lassen (quarkus:dev nutzt dieselbe Datei)
quarkus.openfeature.flagd.offline-path=../flags/flags.json

# Endpunkte der Adapter (WireMock aus devenv, Port 8089)
quarkus.cxf.client."imperium".client-endpoint-url=http://localhost:8089/imperium
quarkus.rest-client."rebellion".url=http://localhost:8089

# Kurze Intervalle fuer die Abgleich-ITs (Timer, Lease, Backoff, Endgueltigkeit)
abgleich.timer-period-millis=500
abgleich.batch=20
abgleich.backoff-max-sekunden=4
abgleich.jitter-anteil=0.2
abgleich.max-versuche=3
zustellung.lease-sekunden=2
zustellung.wiederholung-sekunden=1

# Journal-Relay in Integrationstests: kurze Periode fuer schnelles Konvergieren
journal.relay.timer-period-millis=500
journal.relay.batch=50
